  <!-- Sand trickle -->
  <line x1="50" y1="70" x2="50" y2="85" stroke="#F4A460" stroke-width="3" stroke-linecap="round"/>
  <!-- Glass shine -->
  <line x1="32" y1="22" x2="28" y2="55" stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-linecap="round"/>
</svg>
