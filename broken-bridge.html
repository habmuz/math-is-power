<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌉 Broken Bridge</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1b2e;font-family:'Segoe UI',sans-serif;color:#fff;user-select:none}
#game-canvas{display:block;margin:0 auto;image-rendering:pixelated}
#hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:5px 14px;background:linear-gradient(#0a1520,transparent);z-index:10;pointer-events:none}
#level-info{font-weight:800;font-size:13px;color:#ffd700;text-shadow:0 0 8px #ffd700}
#timer-wrap{display:flex;align-items:center;gap:6px}
#timer-bar-bg{width:120px;height:8px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden}
#timer-bar{height:100%;background:linear-gradient(to right,#ff4444,#ffdd00,#44ff88);border-radius:4px;transition:width .1s linear;transform-origin:left}
#timer-num{font-weight:900;font-size:14px;min-width:3ch;text-align:right;color:#fff}
#tools-row{display:flex;gap:6px}
.tool-slot{width:34px;height:34px;border-radius:8px;border:2px solid rgba(255,255,255,.15);background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:18px;position:relative;transition:all .2s}
.tool-slot.active{border-color:#ffd700;background:rgba(255,215,0,.2);box-shadow:0 0 10px rgba(255,215,0,.4)}
#planks-count{font-weight:800;font-size:13px;color:#c8a96a}
#progress-bar{position:fixed;bottom:0;left:0;right:0;height:6px;background:rgba(0,0,0,.5)}
#progress-fill{height:100%;background:linear-gradient(to right,#22dd55,#ffd700);transition:width .3s}
#msg-toast{position:fixed;top:52px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:5px 18px;font-size:12px;font-weight:700;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
#msg-toast.show{opacity:1}
/* Overlays */
.overlay{position:fixed;inset:0;background:rgba(0,0,10,.92);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;gap:14px;text-align:center;padding:24px}
.overlay.show{display:flex}
.ov-icon{font-size:3.5rem;animation:pop .5s ease}
.ov-title{font-size:2rem;font-weight:900;letter-spacing:1px}
.ov-sub{font-size:.9rem;color:#bbb;max-width:360px;line-height:1.5}
.ov-btn{padding:11px 34px;border:none;border-radius:22px;font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit;margin:4px;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;box-shadow:0 4px 14px rgba(124,58,237,.4)}
.ov-btn.sec{background:linear-gradient(135deg,#1e293b,#334155);box-shadow:none}
.controls-hint{font-size:.72rem;color:#555;margin-top:2px}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div id="hud">
  <div id="level-info">🌉 Level 1</div>
  <div id="timer-wrap">
    <div id="timer-bar-bg"><div id="timer-bar"></div></div>
    <div id="timer-num">60</div>
  </div>
  <div id="tools-row">
    <div class="tool-slot" id="slot-screwdriver" title="Screwdriver — repair boost">🪛</div>
    <div class="tool-slot" id="slot-wrench" title="Wrench — 1.5x repair">🔧</div>
    <div class="tool-slot" id="slot-hammer" title="Hammer — 2x repair">🔨</div>
    <div class="tool-slot" id="slot-shovel" title="Shovel — move faster">🪣</div>
  </div>
  <div id="planks-count">🪵 0</div>
</div>
<div id="msg-toast"></div>
<canvas id="game-canvas"></canvas>
<div id="progress-bar"><div id="progress-fill" style="width:0%"></div></div>

<!-- Start -->
<div class="overlay show" id="start-overlay">
  <div class="ov-icon">🌉</div>
  <div class="ov-title" style="color:#ffd700">Broken Bridge</div>
  <div class="ov-sub">Collect 🪵 planks · spin 💎 crystals to unlock tools · repair bridge sections · reach the 🏰 castle before the 🐊 Crocogon destroys it!</div>
  <div class="controls-hint">← → to move · ↑ / W to jump · E to interact / repair</div>
  <button class="ov-btn" onclick="startLevel(currentLevel)">▶ Play Level 1</button>
  <button class="ov-btn sec" onclick="goBack()">← Back</button>
</div>
<!-- Win -->
<div class="overlay" id="win-overlay">
  <div class="ov-icon">🏰</div>
  <div class="ov-title" style="color:#ffd700">Castle Reached!</div>
  <div class="ov-sub" id="win-msg"></div>
  <button class="ov-btn" id="next-btn" onclick="nextLevel()">▶ Next Level</button>
  <button class="ov-btn sec" onclick="goBack()">← Map</button>
</div>
<!-- Lose -->
<div class="overlay" id="lose-overlay">
  <div class="ov-icon">💀</div>
  <div class="ov-title" style="color:#ef4444">Bridge Collapsed!</div>
  <div class="ov-sub" id="lose-msg"></div>
  <button class="ov-btn" onclick="startLevel(currentLevel)">🔄 Retry</button>
  <button class="ov-btn sec" onclick="goBack()">← Map</button>
</div>

<script>
// ── 50-LEVEL CONFIG ───────────────────────────────────────────────
function makeLevels(){
  return Array.from({length:50},(_,i)=>({
    level:i+1,
    timeLimit:Math.max(22,88-i*1.3),
    sections:Math.min(5,2+Math.floor(i/10)),
    planksNeeded:1+Math.floor(i/15),
    plankCount:Math.max(2,7-Math.floor(i/9)),
    crystalSpins:Math.max(1,4-Math.floor(i/14)),
    toolsAvailable:Math.min(4,1+Math.floor(i/12)),
    crocogonOn:i>=5,
    crocogonSpd:0.5+i*0.025,
    crocogonRate:Math.max(3,14-i*0.22),
  }));
}
const LEVELS=makeLevels();
let currentLevel=1;
const TOOL_KEYS=['screwdriver','wrench','hammer','shovel'];

// ── CANVAS ────────────────────────────────────────────────────────
const canvas=document.getElementById('game-canvas');
const ctx=canvas.getContext('2d');
const W=800,H=480;
canvas.width=W;canvas.height=H;
function resize(){
  const s=Math.min(window.innerWidth/W,(window.innerHeight-6)/H);
  canvas.style.width=W*s+'px';canvas.style.height=H*s+'px';
  canvas.style.marginTop=(window.innerHeight-H*s)/2+'px';
}
window.addEventListener('resize',resize);resize();

// ── INPUT ─────────────────────────────────────────────────────────
const keys={};
const justPressed={};
document.addEventListener('keydown',e=>{
  if(!keys[e.code])justPressed[e.code]=true;
  keys[e.code]=true;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyW','KeyA','KeyD','KeyE'].includes(e.code))e.preventDefault();
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});

// ── STATE ─────────────────────────────────────────────────────────
let S={},animId=null,timerInterval=null;
const GROUND=340;

function startLevel(lvl){
  if(lvl>50){showEndGame();return;}
  currentLevel=lvl;
  hideAll();
  const c=LEVELS[lvl-1];
  document.getElementById('level-info').textContent='🌉 Level '+lvl;

  const secSpacing=500/Math.max(c.sections,1);
  S={
    c,phase:'play',
    time:c.timeLimit,
    planks:0,
    tools:{screwdriver:false,wrench:false,hammer:false,shovel:false},
    sections:Array.from({length:c.sections},(_,i)=>({
      x:150+i*secSpacing,y:GROUND,
      hp:c.planksNeeded,maxHp:c.planksNeeded,
      repaired:false,wobble:0,
    })),
    plankItems:Array.from({length:c.plankCount},(_,i)=>({
      x:80+Math.random()*620,y:GROUND-30-Math.random()*80,
      vx:(Math.random()-.5)*0,vy:0,landed:true,
      collected:false,
    })),
    crystals:TOOL_KEYS.slice(0,c.toolsAvailable).map((tool,i)=>({
      x:60+i*90,y:GROUND-120,tool,
      spins:0,needed:c.crystalSpins,
      unlocked:false,angle:0,glow:0,
    })),
    player:{x:60,y:GROUND,vy:0,onGround:true,facing:1,frame:0,actionTimer:0},
    croc:c.crocogonOn?{x:750,y:GROUND,dir:-1,attackTimer:0,hurt:0}:null,
    castle:{x:718,y:GROUND-60},
    msg:'',msgTimer:0,
    won:false,lost:false,
  };

  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    if(S.phase!=='play')return;
    S.time--;
    if(S.time<=0){S.time=0;lose('Time ran out! ⏰');}
  },1000);
  if(animId)cancelAnimationFrame(animId);
  loop();
}

function lose(msg){
  if(S.lost||S.won)return;
  S.lost=true;S.phase='over';
  clearInterval(timerInterval);
  document.getElementById('lose-msg').textContent=msg;
  document.getElementById('lose-overlay').classList.add('show');
}
function win(){
  if(S.lost||S.won)return;
  S.won=true;S.phase='over';
  clearInterval(timerInterval);
  const t=Math.ceil(S.time);
  document.getElementById('win-msg').textContent='Level '+currentLevel+' done! '+t+'s to spare 🎉';
  document.getElementById('next-btn').style.display=currentLevel>=50?'none':'';
  document.getElementById('win-overlay').classList.add('show');
}
function nextLevel(){startLevel(currentLevel+1);}
function hideAll(){['start-overlay','win-overlay','lose-overlay'].forEach(id=>document.getElementById(id).classList.remove('show'));}
function goBack(){clearInterval(timerInterval);if(animId)cancelAnimationFrame(animId);try{window.parent.closeMiniGameScene&&window.parent.closeMiniGameScene();}catch(e){}}
function showEndGame(){
  document.getElementById('win-msg').textContent='🏆 All 50 levels conquered! You are the ultimate bridge builder!';
  document.getElementById('next-btn').style.display='none';
  document.getElementById('win-overlay').classList.add('show');
}

let toastTimer=null;
function toast(msg){
  const el=document.getElementById('msg-toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),1600);
}

// ── GAME LOOP ─────────────────────────────────────────────────────
function loop(){update();draw();if(!S.won&&!S.lost)animId=requestAnimationFrame(loop);}

function update(){
  if(S.phase!=='play'){Object.keys(justPressed).forEach(k=>delete justPressed[k]);return;}
  const p=S.player,c=S.c;

  // Movement
  const spd=3.5*(S.tools.shovel?1.5:1);
  if(keys['ArrowLeft']||keys['KeyA']){p.x-=spd;p.facing=-1;}
  if(keys['ArrowRight']||keys['KeyD']){p.x+=spd;p.facing=1;}
  if((justPressed['ArrowUp']||justPressed['KeyW']||justPressed['Space'])&&p.onGround){
    p.vy=-11;p.onGround=false;
  }
  p.vy+=0.55;p.y+=p.vy;
  if(p.y>=GROUND){p.y=GROUND;p.vy=0;p.onGround=true;}
  p.x=Math.max(20,Math.min(W-20,p.x));
  p.frame=(p.frame+0.15)%4;
  if(p.actionTimer>0)p.actionTimer--;

  // E key interactions
  if(justPressed['KeyE']||justPressed['Space']&&!p.onGround){
    // Pick up plank
    S.plankItems.forEach(pl=>{
      if(!pl.collected&&dist(p.x,p.y,pl.x,pl.y)<36){
        pl.collected=true;S.planks++;toast('🪵 Plank! ('+S.planks+')');
      }
    });
    // Spin crystal
    S.crystals.forEach(cr=>{
      if(!cr.unlocked&&dist(p.x,p.y,cr.x,cr.y)<38){
        cr.spins++;cr.angle+=Math.PI/2;cr.glow=20;
        if(cr.spins>=cr.needed){
          cr.unlocked=true;S.tools[cr.tool]=true;
          toast(toolEmoji(cr.tool)+' '+cr.tool+' unlocked!');
        } else toast('🔮 Spin: '+cr.spins+'/'+cr.needed);
        p.actionTimer=15;
      }
    });
    // Repair section
    S.sections.forEach(sec=>{
      if(!sec.repaired&&S.planks>0&&dist(p.x,p.y,sec.x,sec.y)<38){
        const speed=S.tools.hammer?2:S.tools.wrench?1.5:1;
        const cost=Math.max(1,Math.ceil(1/speed));
        if(S.planks>=cost){
          S.planks-=cost;sec.hp=Math.max(0,sec.hp-1);sec.wobble=8;
          if(sec.hp<=0){sec.repaired=true;toast('✅ Section repaired!');}
          else toast('🔨 Repairing... ('+sec.hp+'/'+sec.maxHp+' left)');
          p.actionTimer=20;
        }
      }
    });
  }

  // Crystal ambient spin
  S.crystals.forEach(cr=>{cr.angle+=0.02;if(cr.glow>0)cr.glow--;});
  S.sections.forEach(sec=>{if(sec.wobble>0)sec.wobble--;});

  // Crocogon
  if(S.croc){
    const cr=S.croc;
    cr.x+=c.crocogonSpd*cr.dir;
    if(cr.x<80)cr.dir=1;
    if(cr.x>W-80)cr.dir=-1;
    cr.attackTimer+=1/60;
    if(cr.attackTimer>=c.crocogonRate){
      cr.attackTimer=0;
      const t=S.sections.find(s=>!s.repaired);
      if(t){t.hp=Math.min(t.maxHp,t.hp+1);t.wobble=12;toast('🐊 Crocogon attacked!');}
    }
    if(cr.hurt>0)cr.hurt--;
  }

  // Win check
  if(S.sections.every(s=>s.repaired)){
    const c=S.castle;
    if(S.player.x>c.x-10&&S.player.x<c.x+60&&S.player.y>=GROUND-5)win();
  }

  // HUD
  const pct=S.time/S.c.timeLimit;
  document.getElementById('timer-bar').style.width=(pct*100)+'%';
  document.getElementById('timer-num').textContent=Math.ceil(S.time);
  document.getElementById('planks-count').textContent='🪵 '+S.planks;
  TOOL_KEYS.forEach(t=>document.getElementById('slot-'+t).classList.toggle('active',!!S.tools[t]));
  const rep=S.sections.filter(s=>s.repaired).length;
  document.getElementById('progress-fill').style.width=(rep/S.sections.length*100)+'%';

  Object.keys(justPressed).forEach(k=>delete justPressed[k]);
}

function dist(x1,y1,x2,y2){return Math.hypot(x1-x2,y1-y2);}
function toolEmoji(t){return{screwdriver:'🪛',wrench:'🔧',hammer:'🔨',shovel:'🪣'}[t]||'🔧';}

// ── DRAW ──────────────────────────────────────────────────────────
function draw(){
  // Sky gradient
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#0d1b2e');sky.addColorStop(0.6,'#1a2744');sky.addColorStop(1,'#1e3a1e');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  // Stars
  ctx.fillStyle='rgba(255,255,255,.7)';
  const starSeed=[37,71,113,157,199,239,281,317,353,401,443,479,521,557,593,631,673,709,743,787];
  starSeed.forEach((s,i)=>{ctx.beginPath();ctx.arc((s*13)%W,(s*7)%220,0.8+((s*3)%2)*.4,0,6.28);ctx.fill();});

  // Moon
  ctx.fillStyle='#fffde0';ctx.beginPath();ctx.arc(W-80,50,22,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1a2744';ctx.beginPath();ctx.arc(W-72,46,18,0,Math.PI*2);ctx.fill();

  // Water (river)
  const waterY=GROUND+4;
  const wg=ctx.createLinearGradient(0,waterY,0,H);
  wg.addColorStop(0,'#0a3a6e');wg.addColorStop(1,'#051a3a');
  ctx.fillStyle=wg;ctx.fillRect(0,waterY,W,H-waterY);
  // Wave shimmer
  ctx.strokeStyle='rgba(100,180,255,.18)';ctx.lineWidth=2;
  for(let w=0;w<4;w++){
    ctx.beginPath();
    for(let x=0;x<=W;x+=8)ctx.lineTo(x,waterY+6+w*12+Math.sin(x/30+w)*(2+w));
    ctx.stroke();
  }

  // Ground
  const gg=ctx.createLinearGradient(0,GROUND+4,0,waterY+2);
  gg.addColorStop(0,'#5a3a1a');gg.addColorStop(1,'#3a2010');
  ctx.fillStyle=gg;ctx.fillRect(0,GROUND+4,W,waterY-GROUND);
  // Grass strip
  ctx.fillStyle='#2d5a1e';ctx.fillRect(0,GROUND+2,W,5);

  // Planks
  S.plankItems.forEach(pl=>{
    if(pl.collected)return;
    ctx.save();
    ctx.translate(pl.x,pl.y);
    ctx.fillStyle='#c8902a';ctx.fillRect(-14,-5,28,10);
    ctx.fillStyle='#a06820';ctx.fillRect(-14,-5,28,3);
    ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(-12,2,8,2);
    ctx.strokeStyle='#7a4810';ctx.lineWidth=1;ctx.strokeRect(-14,-5,28,10);
    // Grain lines
    ctx.strokeStyle='rgba(0,0,0,.2)';ctx.lineWidth=0.5;
    [-6,0,6].forEach(ox=>{ctx.beginPath();ctx.moveTo(ox,-4);ctx.lineTo(ox+2,4);ctx.stroke();});
    ctx.restore();
  });

  // Crystals
  S.crystals.forEach(cr=>{
    ctx.save();ctx.translate(cr.x,cr.y);
    if(cr.glow>0){ctx.shadowColor=cr.unlocked?'#ffd700':'#44aaff';ctx.shadowBlur=cr.glow*2;}
    const clr=cr.unlocked?'#ffd700':'#44aaff';
    const dark=cr.unlocked?'#aa7700':'#0055cc';
    ctx.rotate(cr.angle);
    // Diamond shape
    ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(10,0);ctx.lineTo(0,16);ctx.lineTo(-10,0);ctx.closePath();
    ctx.fillStyle=clr;ctx.fill();
    ctx.fillStyle=dark;ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(10,0);ctx.lineTo(0,-2);ctx.closePath();ctx.fill();
    ctx.restore();
    // Label
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.beginPath();ctx.roundRect(cr.x-18,cr.y+18,36,14,4);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='9px sans-serif';ctx.textAlign='center';
    ctx.fillText(cr.unlocked?'✓':cr.spins+'/'+cr.needed,cr.x,cr.y+28);
  });

  // Bridge sections
  S.sections.forEach(sec=>{
    const wobX=sec.wobble>0?Math.sin(sec.wobble*0.8)*(sec.wobble*0.4):0;
    ctx.save();ctx.translate(sec.x+wobX,sec.y);
    if(!sec.repaired){
      // Broken supports
      ctx.fillStyle='#3a2010';
      ctx.fillRect(-28,-44,10,44);ctx.fillRect(18,-44,10,44);
      // Water gap
      ctx.fillStyle='rgba(0,80,200,.4)';ctx.fillRect(-18,-6,36,10);
      // HP pips
      for(let j=0;j<sec.maxHp;j++){
        ctx.fillStyle=j<sec.maxHp-sec.hp?'#22dd55':'#ff4444';
        ctx.beginPath();ctx.arc(-8+j*16,-54,5,0,6.28);ctx.fill();
      }
      // Cracked wood pieces
      ctx.fillStyle='#7a4810';
      [[-22,-14,12,8],[10,-8,14,6],[-20,0,10,5]].forEach(([x,y,w,h])=>{
        ctx.save();ctx.translate(x,y);ctx.rotate(0.15);ctx.fillRect(0,0,w,h);ctx.restore();
      });
    } else {
      // Repaired planks
      ctx.fillStyle='#3a2010';ctx.fillRect(-28,-44,10,44);ctx.fillRect(18,-44,10,44);
      const pg=ctx.createLinearGradient(-26,-8,26,-8);
      pg.addColorStop(0,'#c8902a');pg.addColorStop(0.5,'#e0a840');pg.addColorStop(1,'#c8902a');
      ctx.fillStyle=pg;ctx.fillRect(-26,-8,52,12);
      // Plank lines
      ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=1;
      [-10,8].forEach(ox=>{ctx.beginPath();ctx.moveTo(ox,-8);ctx.lineTo(ox,4);ctx.stroke();});
      ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(-26,-8,52,3);
      // Green check
      ctx.fillStyle='#22dd55';ctx.font='bold 16px sans-serif';ctx.textAlign='center';
      ctx.fillText('✓',0,-18);
    }
    ctx.restore();
  });

  // Castle
  const cs=S.castle;
  // Tower body
  const allRep=S.sections.every(s=>s.repaired);
  if(allRep){ctx.shadowColor='#ffd700';ctx.shadowBlur=20;}
  const castleG=ctx.createLinearGradient(cs.x,cs.y-60,cs.x+50,cs.y);
  castleG.addColorStop(0,'#7070b0');castleG.addColorStop(1,'#5050a0');
  ctx.fillStyle=castleG;ctx.fillRect(cs.x,cs.y-60,50,65);
  // Battlements
  ctx.fillStyle='#8888cc';
  [0,15,30].forEach(ox=>{ctx.fillRect(cs.x+ox,cs.y-72,12,14);});
  // Door
  ctx.fillStyle='#2a1a0a';ctx.beginPath();
  ctx.moveTo(cs.x+16,cs.y+5);ctx.lineTo(cs.x+16,cs.y-20);
  ctx.arc(cs.x+25,cs.y-20,9,Math.PI,0);
  ctx.lineTo(cs.x+34,cs.y+5);ctx.closePath();ctx.fill();
  // Windows
  ctx.fillStyle='rgba(255,220,100,.6)';
  [[8,-45],[32,-45],[8,-28],[32,-28]].forEach(([ox,oy])=>{
    ctx.beginPath();ctx.arc(cs.x+ox,cs.y+oy,5,0,6.28);ctx.fill();
  });
  // Flag
  ctx.strokeStyle='#888';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(cs.x+25,cs.y-72);ctx.lineTo(cs.x+25,cs.y-92);ctx.stroke();
  ctx.fillStyle='#ff4444';ctx.beginPath();ctx.moveTo(cs.x+25,cs.y-92);ctx.lineTo(cs.x+42,cs.y-86);ctx.lineTo(cs.x+25,cs.y-80);ctx.closePath();ctx.fill();
  if(allRep){ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,215,0,.2)';ctx.fillRect(cs.x-15,cs.y-85,80,90);
    ctx.fillStyle='#ffd700';ctx.font='bold 11px sans-serif';ctx.textAlign='center';
    ctx.fillText('⬆ ENTER!',cs.x+25,cs.y-90);
  }

  // Crocogon
  if(S.croc){
    const cr=S.croc;
    ctx.save();ctx.translate(cr.x,cr.y);
    if(cr.dir<0){ctx.scale(-1,1);}
    if(cr.hurt>0){ctx.globalAlpha=0.6+Math.sin(cr.hurt*0.5)*0.4;}
    // Body
    ctx.fillStyle='#2a8040';
    ctx.beginPath();ctx.ellipse(0,-8,26,14,0,0,6.28);ctx.fill();
    // Head
    ctx.fillStyle='#22aa44';ctx.beginPath();ctx.ellipse(22,-10,16,10,0.1,0,6.28);ctx.fill();
    // Snout
    ctx.fillStyle='#1a8833';ctx.beginPath();ctx.ellipse(34,-8,10,6,0,0,6.28);ctx.fill();
    // Teeth
    ctx.fillStyle='#fffde0';
    [28,32,36].forEach(ox=>{ctx.fillRect(ox,-6,3,5);});
    // Eye
    ctx.fillStyle='#ffdd00';ctx.beginPath();ctx.arc(20,-14,4,0,6.28);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(21,-14,2,0,6.28);ctx.fill();
    // Spines
    ctx.fillStyle='#1a6030';
    [-12,-4,4,12].forEach(ox=>{ctx.beginPath();ctx.moveTo(ox,-22);ctx.lineTo(ox+5,-12);ctx.lineTo(ox-5,-12);ctx.closePath();ctx.fill();});
    // Legs
    ctx.fillStyle='#2a8040';[[-16,4],[0,4],[14,4]].forEach(([lx,ly])=>{ctx.fillRect(lx,0,8,12);});
    // Tail
    ctx.beginPath();ctx.moveTo(-26,-8);ctx.quadraticCurveTo(-46,0,-52,10);ctx.quadraticCurveTo(-50,-10,-26,-8);ctx.fill();
    ctx.globalAlpha=1;ctx.restore();
  }

  // Player
  drawPlayer();

  // Controls hint (fade out after 5s)
  if(S.time>S.c.timeLimit-6){
    ctx.globalAlpha=Math.min(1,(S.c.timeLimit-S.time));
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(W/2-140,H-32,280,22);
    ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='10px sans-serif';ctx.textAlign='center';
    ctx.fillText('← → move  ·  ↑/W jump  ·  E interact/repair',W/2,H-18);
    ctx.globalAlpha=1;
  }
}

function drawPlayer(){
  const p=S.player;
  ctx.save();ctx.translate(p.x,p.y);
  if(p.facing<0)ctx.scale(-1,1);

  // Shadow
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,2,14,4,0,0,6.28);ctx.fill();

  // Body (orange tunic)
  ctx.fillStyle='#e06820';ctx.fillRect(-8,-34,16,22);
  // Legs
  const legOff=p.onGround?(Math.sin(p.frame*1.5)*6):0;
  ctx.fillStyle='#5a3000';ctx.fillRect(-8,-12,7,14+legOff);ctx.fillRect(1,-12,7,14-legOff);
  // Shoes
  ctx.fillStyle='#3a1800';ctx.fillRect(-10,legOff,9,5);ctx.fillRect(3,-legOff,9,5);
  // Arms
  ctx.fillStyle='#c05010';
  const armSwing=p.actionTimer>0?-0.6:Math.sin(p.frame*1.5)*0.4;
  ctx.save();ctx.translate(-9,-28);ctx.rotate(armSwing);ctx.fillRect(-5,0,6,16);ctx.restore();
  ctx.save();ctx.translate(9,-28);ctx.rotate(-armSwing);ctx.fillRect(-1,0,6,16);ctx.restore();
  // Head
  ctx.fillStyle='#f5c5a0';ctx.beginPath();ctx.arc(0,-40,11,0,6.28);ctx.fill();
  // Hair
  ctx.fillStyle='#3a1800';ctx.beginPath();ctx.arc(0,-40,11,Math.PI,0);ctx.fill();
  ctx.fillStyle='#3a1800';ctx.fillRect(-11,-42,22,6);
  // Eye
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(4,-40,2.5,0,6.28);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(5,-41,1,0,6.28);ctx.fill();
  // Mouth
  ctx.strokeStyle='#8b4500';ctx.lineWidth=1;ctx.beginPath();ctx.arc(2,-37,3,0.2,Math.PI-0.2);ctx.stroke();
  // Action sparkle
  if(p.actionTimer>10){
    ctx.fillStyle='#ffd700';ctx.font='16px sans-serif';ctx.textAlign='center';
    ctx.fillText('✨',14,-50);
  }
  ctx.restore();
}
</script>
