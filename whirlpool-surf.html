<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Neucha&display=swap" rel="stylesheet">
<title>🌊 Whirlpool Escape</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#000d22;font-family:'Neucha',cursive;color:#a0d8ef;display:flex;flex-direction:column;align-items:center;padding:6px 8px;gap:4px}
#hdr{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:900px}
#hdr h1{font-size:1.05rem;color:#55ccff;letter-spacing:2px;text-shadow:0 0 10px #0088ff}
#hdr-r{display:flex;gap:10px;font-size:.75rem;color:#336688;align-items:center}
#hdr-r b{color:#66bbee}
#back-btn{background:none;border:1px solid #1a3a66;color:#336688;border-radius:.4rem;padding:.22rem .55rem;font-size:.68rem;cursor:pointer}
#back-btn:hover{color:#66aadd;border-color:#4466aa}
canvas{border-radius:10px;border:2px solid #1a4466;display:block;box-shadow:0 0 40px rgba(0,120,255,.2)}
#ctrl{font-size:.62rem;color:#224455;letter-spacing:.8px;text-align:center}
/* Progress bar */
#prog-bar{width:100%;max-width:900px;height:7px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden}
#prog-fill{height:100%;background:linear-gradient(to right,#0088ff,#00ffcc);border-radius:4px;width:0%;transition:width .2s}
#end-overlay{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,8,22,.96);border:2px solid #00aaff;border-radius:14px;padding:26px 34px;text-align:center;z-index:30;min-width:240px}
#end-overlay.show{display:block}
.eo-t{font-size:2rem;font-weight:900;margin-bottom:8px}
.eo-s{font-size:.82rem;color:#336688;margin-bottom:14px}
.eo-btn{padding:.55rem 1.6rem;background:linear-gradient(135deg,#004488,#002255);border:2px solid #0088ff;border-radius:.6rem;color:#88ddff;font-size:.88rem;font-weight:700;cursor:pointer;margin:4px;font-family:'Neucha',cursive}
</style>
</head>
<body>
<div id="hdr">
  <button id="back-btn" onclick="goBack()">← Map</button>
  <h1>🌊 Whirlpool Escape</h1>
  <div id="hdr-r">Score: <b id="score">0</b> &nbsp;|&nbsp; Stars: <b id="stars">0</b> &nbsp;|&nbsp; 🏖️ <b id="dist-lbl">Far...</b></div>
</div>
<div id="prog-bar"><div id="prog-fill"></div></div>
<canvas id="c"></canvas>
<div id="ctrl">← → steer · dodge whirlpools · collect ⭐ · reach the shore!</div>
<div id="end-overlay">
  <div class="eo-t" id="eo-title">🏖️</div>
  <div style="font-size:1.1rem;color:#55ccff;margin-bottom:6px" id="eo-score"></div>
  <div class="eo-s" id="eo-sub"></div>
  <button class="eo-btn" onclick="startGame()">Surf Again 🌊</button>
  <button class="eo-btn" onclick="goBack()">← Map</button>
</div>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=Math.min(window.innerWidth-16,900);
const H=Math.min(window.innerHeight-90,490);
cv.width=W; cv.height=H;

const TOTAL_DIST=4000; // world units to reach shore

let score=0,starsCollected=0,running=false,gameOver=false,won=false;
let animId=null,wipeFlash=0;
let scrollY=0,scrollSpeed=1.8;

// Surfer
let sx=W/2,sy=H*0.72,sVx=0;

// Whirlpools / collectibles / foam
let whirlpools=[],collectibles=[],foam=[];
let nextWhirl=120,nextCollect=55;

// Win animation
let hopAnim=0,hopDone=false;

const keys={};
document.addEventListener('keydown',e=>{keys[e.key]=true});
document.addEventListener('keyup',e=>{keys[e.key]=false});
let touchStartX=null;
document.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX},{passive:true});
document.addEventListener('touchmove',e=>{
  if(touchStartX===null)return;
  sVx+=(e.touches[0].clientX-touchStartX)*0.05;
  touchStartX=e.touches[0].clientX;
},{passive:true});

function updateHUD(){
  document.getElementById('score').textContent=score;
  document.getElementById('stars').textContent=starsCollected;
  const pct=Math.min(scrollY/TOTAL_DIST,1);
  document.getElementById('prog-fill').style.width=(pct*100)+'%';
  const left=Math.max(0,Math.round((TOTAL_DIST-scrollY)/80));
  document.getElementById('dist-lbl').textContent=left===0?'Almost there!':left+'m away';
}

function spawnWhirlpool(){
  const wx=80+Math.random()*(W-160);
  const wy=scrollY-H*0.5-Math.random()*H*0.7;
  const r=50+Math.random()*30;
  whirlpools.push({wx,wy,r,spin:0,bonusGiven:false});
}
function spawnCollectible(){
  const wx=40+Math.random()*(W-80);
  const wy=scrollY-H*0.3-Math.random()*H*0.9;
  collectibles.push({wx,wy,type:Math.random()<0.6?'star':'ring',pulse:Math.random()*Math.PI*2});
}
function spawnFoam(x,y,n=5){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2;
    foam.push({x,y,vx:Math.cos(a)*(1+Math.random()*2),vy:Math.sin(a)*(1+Math.random()*2),r:2+Math.random()*5,life:20,maxLife:20});
  }
}

// ── DRAW OCEAN ────────────────────────────────────────────────
function drawOcean(t){
  const og=ctx.createLinearGradient(0,0,0,H);
  og.addColorStop(0,'#001833'); og.addColorStop(1,'#001a38');
  ctx.fillStyle=og; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(100,180,255,0.06)'; ctx.lineWidth=1.5;
  for(let i=0;i<14;i++){
    const wy=((scrollY*0.35+i*(H/14)+t/90)%H);
    ctx.beginPath(); ctx.moveTo(0,wy);
    for(let x2=0;x2<=W;x2+=40)ctx.lineTo(x2,wy+Math.sin(x2/65+t/900+i)*4);
    ctx.stroke();
  }
  // Sunlight glints
  ctx.globalAlpha=0.07;
  for(let s=0;s<4;s++){
    const shx=80+s*220+Math.sin(t/1400+s)*50;
    const shy=H*0.45+Math.cos(t/1000+s)*50;
    const sg=ctx.createRadialGradient(shx,shy,0,shx,shy,70);
    sg.addColorStop(0,'#ffffaa'); sg.addColorStop(1,'transparent');
    ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(shx,shy,70,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
  // Seagulls
  ctx.strokeStyle='rgba(200,230,255,0.2)'; ctx.lineWidth=1;
  for(let g=0;g<5;g++){
    const gx=(40+g*180+t/38+g*60)%W;
    const gy=14+g*10+Math.sin(t/700+g)*7;
    ctx.beginPath();
    ctx.moveTo(gx-7,gy); ctx.quadraticCurveTo(gx-3,gy-5,gx,gy);
    ctx.moveTo(gx,gy); ctx.quadraticCurveTo(gx+3,gy-5,gx+7,gy);
    ctx.stroke();
  }
}

// ── DRAW SHORE ────────────────────────────────────────────────
function drawShore(t){
  const shoreWorldY=-(TOTAL_DIST-scrollY); // where shore is in screen coords
  const shoreScreenY=H*0.1+shoreWorldY;    // screen position

  if(shoreScreenY>H+100)return; // off screen, don't draw

  // Sandy beach strip
  const sandH=60;
  const sg=ctx.createLinearGradient(0,shoreScreenY-sandH,0,shoreScreenY+20);
  sg.addColorStop(0,'#c8a84a'); sg.addColorStop(0.5,'#e0c070'); sg.addColorStop(1,'#d4aa55');
  ctx.fillStyle=sg; ctx.fillRect(0,shoreScreenY-sandH,W,sandH+20);

  // Foam at waterline
  ctx.fillStyle='rgba(255,255,255,0.7)';
  for(let f=0;f<W;f+=18){
    const fw=8+Math.sin(f+t/400)*5;
    ctx.beginPath(); ctx.ellipse(f,shoreScreenY,fw,4,0,0,Math.PI*2); ctx.fill();
  }

  // Palm trees on shore
  ctx.font='36px serif'; ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillText('🌴',80,shoreScreenY-sandH+8);
  ctx.fillText('🌴',W-80,shoreScreenY-sandH+8);
  ctx.fillText('🌴',W/2,shoreScreenY-sandH+2);

  // "SHORE!" label when getting close
  const dist=TOTAL_DIST-scrollY;
  if(dist<600){
    ctx.font='bold 18px Neucha,cursive';
    ctx.fillStyle=`rgba(255,230,100,${1-(dist/600)})`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🏖️  Almost there!',W/2,shoreScreenY-sandH-18);
  }
}

// ── DRAW WHIRLPOOL ────────────────────────────────────────────
function drawWhirlpool(wp,t){
  const scx=wp.wx, scy=wp.wy+scrollY;
  if(scy<-160||scy>H+160)return;

  // Outer danger glow
  const og=ctx.createRadialGradient(scx,scy,wp.r*0.2,scx,scy,wp.r*1.8);
  og.addColorStop(0,'rgba(0,180,255,0.7)');
  og.addColorStop(0.5,'rgba(0,100,220,0.35)');
  og.addColorStop(1,'rgba(0,60,180,0)');
  ctx.fillStyle=og; ctx.beginPath(); ctx.arc(scx,scy,wp.r*1.8,0,Math.PI*2); ctx.fill();

  // Spinning rings — bright & thick
  ctx.setLineDash([8,4]);
  for(let i=0;i<5;i++){
    const rr=wp.r*(0.2+i*0.2);
    const alpha=0.55+i*0.09;
    ctx.strokeStyle=`rgba(80,210,255,${alpha})`; ctx.lineWidth=2.5;
    ctx.lineDashOffset=-(wp.spin*(i+1)*7);
    ctx.beginPath(); ctx.arc(scx,scy,rr,0,Math.PI*2); ctx.stroke();
  }
  ctx.setLineDash([]);

  // Swirl arms
  for(let arm=0;arm<6;arm++){
    const a=wp.spin+arm*(Math.PI*2/6);
    ctx.strokeStyle='rgba(150,230,255,0.75)'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(scx,scy,wp.r*0.6,a,a+0.65); ctx.stroke();
  }

  // Warning label
  ctx.save();
  ctx.globalAlpha=0.9;
  ctx.font=`bold ${Math.round(wp.r*0.55)}px sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#ff4444';
  ctx.fillText('⚠️',scx,scy);
  ctx.restore();

  // Dark sucking core
  const cg=ctx.createRadialGradient(scx,scy,0,scx,scy,wp.r*0.38);
  cg.addColorStop(0,'rgba(0,0,20,0.98)'); cg.addColorStop(1,'rgba(0,5,20,0)');
  ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(scx,scy,wp.r*0.38,0,Math.PI*2); ctx.fill();
}

// ── DRAW COLLECTIBLES ─────────────────────────────────────────
function drawCollectibles(t){
  for(const c of collectibles){
    const scx=c.wx, scy=c.wy+scrollY;
    if(scy<-30||scy>H+30)continue;
    const p=Math.sin(t/280+c.pulse)*0.18+0.82;
    ctx.font=`${20*p}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    if(c.type==='star')ctx.fillText('⭐',scx,scy);
    else{
      ctx.strokeStyle=`rgba(255,215,0,${0.85*p})`; ctx.lineWidth=3*p;
      ctx.beginPath(); ctx.arc(scx,scy,11,0,Math.PI*2); ctx.stroke();
    }
  }
}

// ── DRAW SURFER ───────────────────────────────────────────────
function drawSurfer(t){
  // Win hop animation
  if(won){
    const hop=Math.max(0,Math.sin(hopAnim*0.15)*40);
    const scaleX=1+Math.sin(hopAnim*0.1)*0.1;
    ctx.save(); ctx.translate(sx,sy-hop); ctx.scale(scaleX,1);
    ctx.font='30px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🤸',0,0);
    ctx.restore();
    return;
  }
  // Wake
  for(let i=1;i<=5;i++){
    const wy=sy+i*8;
    ctx.strokeStyle=`rgba(140,210,255,${0.16-i*0.025})`; ctx.lineWidth=2.5-i*0.3;
    ctx.beginPath(); ctx.moveTo(sx-i*3,wy); ctx.lineTo(sx+i*3,wy); ctx.stroke();
  }
  const gg=ctx.createRadialGradient(sx,sy,0,sx,sy,26);
  gg.addColorStop(0,'rgba(80,200,255,0.22)'); gg.addColorStop(1,'rgba(80,200,255,0)');
  ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(sx,sy,26,0,Math.PI*2); ctx.fill();
  const lean=Math.max(-0.3,Math.min(0.3,sVx*0.05));
  ctx.save(); ctx.translate(sx,sy); ctx.rotate(lean);
  ctx.font='28px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('🏄',0,0);
  ctx.restore();
  if(wipeFlash>0){
    ctx.fillStyle=`rgba(255,50,0,${wipeFlash/20*0.38})`; ctx.fillRect(0,0,W,H);
    wipeFlash--;
  }
}

function drawFoam(){
  foam=foam.filter(f=>f.life>0);
  for(const f of foam){
    ctx.globalAlpha=f.life/f.maxLife*0.55;
    ctx.fillStyle='#aaddff';
    ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,Math.PI*2); ctx.fill();
    f.x+=f.vx; f.y+=f.vy; f.r*=0.93; f.life--;
  }
  ctx.globalAlpha=1;
}

// ── UPDATE ────────────────────────────────────────────────────
function update(){
  if(!running||gameOver)return;

  if(won){hopAnim++;if(hopAnim>80&&!hopDone){hopDone=true;showWin();}return;}

  // Controls
  if(keys['ArrowLeft']||keys['a'])sVx-=0.55;
  if(keys['ArrowRight']||keys['d'])sVx+=0.55;
  sVx*=0.88; sx=Math.max(18,Math.min(W-18,sx+sVx));

  // Scroll forward
  scrollY+=scrollSpeed;
  scrollSpeed=Math.min(scrollSpeed+0.002,3.2);

  // Check shore reached
  if(scrollY>=TOTAL_DIST){
    won=true; hopAnim=0; hopDone=false;
    spawnFoam(sx,sy,12); return;
  }

  // Spawn
  if(--nextWhirl<=0){spawnWhirlpool();nextWhirl=110+Math.random()*140;}
  if(--nextCollect<=0){spawnCollectible();nextCollect=45+Math.random()*70;}

  // Whirlpool physics
  const surferWorldY=-(sy)+scrollY; // surfer in world space (y axis flipped for scroll)
  for(const wp of whirlpools){
    wp.spin+=0.045;
    // screen y of whirlpool
    const scx=wp.wx, scy=wp.wy+scrollY;
    const dx=sx-scx, dy=sy-scy;
    const dist=Math.hypot(dx,dy);
    const PULL_R=wp.r*2.2, SAFE_R=wp.r*0.55, BONUS_R=wp.r*1.7;
    if(dist<PULL_R){
      const pullStr=(PULL_R-dist)/PULL_R*0.45;
      sVx-=dx/dist*pullStr;
    }
    if(!wp.bonusGiven&&dist>SAFE_R&&dist<BONUS_R){
      wp.bonusGiven=true; score+=30; updateHUD(); spawnFoam(sx,sy,6);
    }
    if(dist<SAFE_R*0.55){
      score=Math.max(0,score-12); sx=W/2; sVx=0; wipeFlash=20; updateHUD();
    }
  }
  whirlpools=whirlpools.filter(wp=>{const scy=wp.wy+scrollY;return scy<H+200;});

  // Collect
  for(const c of collectibles){
    const scx=c.wx, scy=c.wy+scrollY;
    if(Math.hypot(sx-scx,sy-scy)<26){
      if(c.type==='star'){starsCollected++;score+=15;}
      else score+=25;
      updateHUD(); spawnFoam(sx,sy,4);
      c.type=null;
    }
  }
  collectibles=collectibles.filter(c=>c.type!==null);
  updateHUD();
}

function showWin(){
  gameOver=true;
  const grade=score>=400?'🏆 Champion Surfer!':score>=200?'⭐ Great Escape!':score>=80?'🤙 You Made It!':'🏖️ Shore Reached!';
  document.getElementById('eo-title').textContent=grade;
  document.getElementById('eo-score').textContent=`Score: ${score} · Stars: ${starsCollected}`;
  document.getElementById('eo-sub').textContent='You surfed through the whirlpools and reached the shore! 🌴';
  document.getElementById('end-overlay').classList.add('show');
}

function gameLoop(t){
  if(!running)return;
  update();
  drawOcean(t);
  drawShore(t);
  for(const wp of whirlpools)drawWhirlpool(wp,t);
  drawCollectibles(t);
  drawFoam();
  drawSurfer(t);
  // Status label
  if(!won){
    const near=whirlpools.find(wp=>{const d=Math.hypot(sx-wp.wx,sy-(wp.wy+scrollY));return d<wp.r*1.7;});
    ctx.font='bold 13px Neucha,cursive'; ctx.textAlign='left';
    ctx.fillStyle=near?'#00ffcc':'#336688';
    ctx.fillText(near?'🌀 Ride the edge! +30':'🌊 Surfing to shore...',10,H-8);
  }
  animId=requestAnimationFrame(gameLoop);
}

function startGame(){
  score=0;starsCollected=0;running=true;gameOver=false;won=false;hopAnim=0;hopDone=false;
  sx=W/2;sy=H*0.72;sVx=0;scrollY=0;scrollSpeed=1.8;
  whirlpools=[];collectibles=[];foam=[];wipeFlash=0;nextWhirl=120;nextCollect=55;
  document.getElementById('end-overlay').classList.remove('show');
  updateHUD();
  cancelAnimationFrame(animId);
  requestAnimationFrame(gameLoop);
}
function goBack(){
  running=false;cancelAnimationFrame(animId);
  if(window.parent&&window.parent.closeMiniGameScene)window.parent.closeMiniGameScene();
  else history.back();
}
startGame();
</script>
</body>
</html>
