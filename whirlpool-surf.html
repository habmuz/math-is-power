<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Neucha&display=swap" rel="stylesheet">
<title>🌊 Whirlpool Escape</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 0%,#001a3a,#000d22);font-family:'Neucha',cursive;color:#a0d8ef;display:flex;flex-direction:column;align-items:center;padding:6px 8px;gap:5px}
#hdr{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:900px}
#hdr h1{font-size:1.1rem;color:#55ccff;letter-spacing:2px;text-shadow:0 0 12px #0088ff}
#hdr-r{display:flex;gap:14px;font-size:.75rem;color:#336688;align-items:center}
#hdr-r b{color:#66bbee}
#back-btn{background:none;border:1px solid #1a3a66;color:#336688;border-radius:.4rem;padding:.22rem .55rem;font-size:.68rem;cursor:pointer}
#back-btn:hover{color:#66aadd;border-color:#4466aa}
canvas{border-radius:12px;border:2px solid #1a4466;display:block;box-shadow:0 0 50px rgba(0,140,255,.25)}
#ctrl{font-size:.64rem;color:#335566;letter-spacing:.8px;text-align:center}
#end-overlay{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,10,28,.96);border:2px solid #00aaff;border-radius:14px;padding:28px 36px;text-align:center;z-index:30;min-width:240px}
#end-overlay.show{display:block}
.eo-t{font-size:2rem;font-weight:900;margin-bottom:8px}
.eo-s{font-size:.85rem;color:#336688;margin-bottom:14px}
.eo-btn{padding:.6rem 1.8rem;background:linear-gradient(135deg,#004488,#002255);border:2px solid #0088ff;border-radius:.6rem;color:#88ddff;font-size:.9rem;font-weight:700;cursor:pointer;margin:4px;font-family:'Neucha',cursive}
.eo-btn:hover{background:linear-gradient(135deg,#0055aa,#003377)}
</style>
</head>
<body>
<div id="hdr">
  <button id="back-btn" onclick="goBack()">← Map</button>
  <h1>🌊 Whirlpool Escape</h1>
  <div id="hdr-r">Score: <b id="score">0</b> &nbsp;|&nbsp; Stars: <b id="stars">0</b> &nbsp;|&nbsp; Time: <b id="timer">60</b>s</div>
</div>
<canvas id="c"></canvas>
<div id="ctrl">← → steer · stay in the green zone · avoid the black hole!</div>
<div id="end-overlay">
  <div class="eo-t" id="eo-title">🌊</div>
  <div style="font-size:1.1rem;color:#55ccff;margin-bottom:6px" id="eo-score"></div>
  <div class="eo-s" id="eo-sub"></div>
  <button class="eo-btn" onclick="startGame()">Play Again 🌊</button>
  <button class="eo-btn" onclick="goBack()">← Map</button>
</div>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=Math.min(window.innerWidth-16,900);
const H=Math.min(window.innerHeight-96,500);
cv.width=W; cv.height=H;
const cx=W/2, cy=H/2;

let score=0,starsCollected=0,timeLeft=60,running=false,gameOver=false;
let animId=null,timerInt=null,wipeFlash=0;

// Whirlpool zones
const INNER_R=36, SWEET_MIN=90, SWEET_MAX=155, OUTER_R=180;

// Surfer
let sAngle=0,sR=115,sVelR=0,sSpeed=2.0;

// Objects (stars, rings, boosts)
let objects=[];
function spawnObj(){
  if(objects.length>=7)return;
  const type=Math.random()<0.55?'star':Math.random()<0.5?'ring':'boost';
  const a=Math.random()*Math.PI*2;
  const r=SWEET_MIN+Math.random()*(SWEET_MAX-SWEET_MIN+25);
  objects.push({type,angle:a,r,collected:false,pulse:Math.random()*Math.PI*2});
}

const keys={};
document.addEventListener('keydown',e=>{keys[e.key]=true});
document.addEventListener('keyup',e=>{keys[e.key]=false});

// Touch
let touchX=null;
cv.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;e.preventDefault();},{passive:false});
cv.addEventListener('touchmove',e=>{
  if(touchX===null)return;
  const dx=e.touches[0].clientX-touchX;
  sAngle+=dx*0.004; touchX=e.touches[0].clientX; e.preventDefault();
},{passive:false});

function updateHUD(){
  document.getElementById('score').textContent=score;
  document.getElementById('stars').textContent=starsCollected;
  document.getElementById('timer').textContent=Math.max(0,timeLeft);
}

function drawScene(t){
  // Ocean background
  const bg=ctx.createRadialGradient(cx,cy,0,cx,cy,W*0.7);
  bg.addColorStop(0,'#002244'); bg.addColorStop(1,'#000e22');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  // Whirlpool rings (animated foam)
  for(let i=4;i>=0;i--){
    const rr=INNER_R+(i+1)*26;
    const a=0.06-i*0.008;
    ctx.strokeStyle=`rgba(120,200,255,${a})`;
    ctx.lineWidth=2;
    ctx.setLineDash([8,6]); ctx.lineDashOffset=-t/60*(i+1)*8;
    ctx.beginPath(); ctx.arc(cx,cy,rr,0,Math.PI*2); ctx.stroke();
  }
  ctx.setLineDash([]);

  // Sweet spot ring (green glow band)
  ctx.strokeStyle='rgba(0,255,120,0.18)';
  ctx.lineWidth=SWEET_MAX-SWEET_MIN;
  ctx.beginPath(); ctx.arc(cx,cy,(SWEET_MIN+SWEET_MAX)/2,0,Math.PI*2); ctx.stroke();

  // Danger inner (red glow)
  const dg=ctx.createRadialGradient(cx,cy,0,cx,cy,INNER_R+14);
  dg.addColorStop(0,'rgba(255,60,0,0.3)'); dg.addColorStop(1,'rgba(255,60,0,0)');
  ctx.fillStyle=dg; ctx.beginPath(); ctx.arc(cx,cy,INNER_R+14,0,Math.PI*2); ctx.fill();

  // Vortex center
  ctx.fillStyle='rgba(0,0,10,0.95)'; ctx.beginPath(); ctx.arc(cx,cy,INNER_R,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(0,80,180,0.5)'; ctx.lineWidth=2; ctx.stroke();
  // Spiral lines in center
  for(let s=0;s<5;s++){
    const a=t/800+s*(Math.PI*2/5);
    ctx.strokeStyle=`rgba(0,60,160,0.3)`; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(cx,cy,INNER_R-6,a,a+Math.PI*0.6); ctx.stroke();
  }

  // Seagulls
  ctx.strokeStyle='rgba(180,220,255,0.22)'; ctx.lineWidth=1;
  for(let g=0;g<4;g++){
    const gx=40+g*220+Math.sin(t/1500+g)*18;
    const gy=16+Math.cos(t/1100+g)*10;
    ctx.beginPath();
    ctx.moveTo(gx-7,gy); ctx.quadraticCurveTo(gx-3,gy-5,gx,gy);
    ctx.moveTo(gx,gy); ctx.quadraticCurveTo(gx+3,gy-5,gx+7,gy);
    ctx.stroke();
  }

  // Sunlight shimmer on water
  for(let sh=0;sh<6;sh++){
    const sx=80+sh*120+Math.sin(t/800+sh)*30;
    const sy=H-40+Math.cos(t/600+sh)*15;
    const a=Math.sin(t/400+sh)*0.5+0.5;
    ctx.strokeStyle=`rgba(255,240,180,${a*0.12})`; ctx.lineWidth=1+a;
    ctx.beginPath(); ctx.moveTo(sx-20,sy); ctx.lineTo(sx+20,sy); ctx.stroke();
  }
}

function drawObjects(t){
  for(const o of objects){
    if(o.collected)continue;
    const ox=cx+Math.cos(o.angle)*o.r;
    const oy=cy+Math.sin(o.angle)*o.r;
    const p=Math.sin(t/300+o.pulse)*0.18+0.82;
    ctx.font=`${20*p}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    if(o.type==='star')ctx.fillText('⭐',ox,oy);
    else if(o.type==='ring'){
      ctx.strokeStyle=`rgba(255,215,0,${0.85*p})`; ctx.lineWidth=3*p;
      ctx.beginPath(); ctx.arc(ox,oy,12,0,Math.PI*2); ctx.stroke();
      ctx.strokeStyle=`rgba(255,180,0,${0.4*p})`; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(ox,oy,18,0,Math.PI*2); ctx.stroke();
    }
    else ctx.fillText('💨',ox,oy);
    o.angle+=0.006;
  }
}

function drawSurfer(){
  const sx=cx+Math.cos(sAngle)*sR;
  const sy=cy+Math.sin(sAngle)*sR;
  const inSweet=sR>=SWEET_MIN&&sR<=SWEET_MAX;
  const tooClose=sR<SWEET_MIN;
  const glowColor=inSweet?'rgba(0,255,120,0.7)':tooClose?'rgba(255,80,0,0.8)':'rgba(0,120,255,0.6)';

  // Wake trail
  for(let i=1;i<=5;i++){
    const ta=sAngle-i*0.1;
    const wx=cx+Math.cos(ta)*sR, wy=cy+Math.sin(ta)*sR;
    ctx.strokeStyle=`rgba(100,200,255,${0.25-i*0.04})`; ctx.lineWidth=3-i*0.4;
    if(i===1){ctx.beginPath();ctx.moveTo(sx,sy);}
    ctx.lineTo(wx,wy);
  }
  ctx.stroke();

  // Glow ring
  ctx.strokeStyle=glowColor; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(sx,sy,22,0,Math.PI*2); ctx.stroke();

  // Big splash on wipeout
  if(wipeFlash>0){
    ctx.fillStyle=`rgba(255,60,0,${wipeFlash/18*0.35})`;
    ctx.fillRect(0,0,W,H);
    wipeFlash--;
  }

  // Surfer emoji
  ctx.save(); ctx.translate(sx,sy); ctx.rotate(sAngle+Math.PI/2);
  ctx.font='26px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('🏄',0,0);
  ctx.restore();

  // Speed trail stars
  if(sSpeed>2.6){
    ctx.font='12px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.globalAlpha=0.5;
    ctx.fillText('✨',sx-Math.cos(sAngle)*30,sy-Math.sin(sAngle)*30);
    ctx.globalAlpha=1;
  }
}

function drawHUD(){
  const inSweet=sR>=SWEET_MIN&&sR<=SWEET_MAX;
  const tooClose=sR<SWEET_MIN;
  const label=inSweet?'🟢 Sweet Spot!':tooClose?'⚠️ Too Close!':'💙 Move In!';
  ctx.font='bold 13px Neucha,cursive'; ctx.textAlign='left';
  ctx.fillStyle=inSweet?'#00ff88':tooClose?'#ff4422':'#4488ff';
  ctx.fillText(label,10,H-10);
}

function checkCollect(){
  const sx=cx+Math.cos(sAngle)*sR;
  const sy=cy+Math.sin(sAngle)*sR;
  for(const o of objects){
    if(o.collected)continue;
    const ox=cx+Math.cos(o.angle)*o.r;
    const oy=cy+Math.sin(o.angle)*o.r;
    if(Math.hypot(sx-ox,sy-oy)<26){
      o.collected=true;
      if(o.type==='star'){starsCollected++;score+=15;}
      else if(o.type==='ring'){score+=25;}
      else{sSpeed=Math.min(sSpeed+0.4,3.8);score+=10;}
      updateHUD();
    }
  }
  objects=objects.filter(o=>!o.collected);
}

function update(){
  if(!running||gameOver)return;
  if(keys['ArrowLeft']||keys['a'])sAngle-=0.045;
  if(keys['ArrowRight']||keys['d'])sAngle+=0.045;
  if(keys['ArrowUp']||keys['w'])sVelR-=0.35;
  if(keys['ArrowDown']||keys['s'])sVelR+=0.35;
  sAngle+=sSpeed*(Math.PI/180)*1.6;
  const pull=sR>SWEET_MAX?-0.18:sR<SWEET_MIN?0.2:0;
  sVelR+=pull; sVelR*=0.87;
  sR=Math.max(22,Math.min(OUTER_R+12,sR+sVelR));
  sSpeed=Math.max(1.4,sSpeed-0.006);
  if(sR<INNER_R+5){score=Math.max(0,score-8);sR=SWEET_MIN;sVelR=0;sSpeed=1.4;wipeFlash=18;updateHUD();}
  if(Math.random()<0.018)spawnObj();
  checkCollect();
}

let lastT=0;
function gameLoop(t){
  if(!running)return;
  update();
  drawScene(t);
  drawObjects(t);
  drawSurfer();
  drawHUD();
  animId=requestAnimationFrame(gameLoop);
}

function endGame(){
  running=false; gameOver=true;
  clearInterval(timerInt); cancelAnimationFrame(animId);
  const grade=score>=300?'🏆 Master Surfer!':score>=150?'⭐ Great Ride!':score>=60?'🤙 Nice!':'🏄 Keep Going!';
  document.getElementById('eo-title').textContent=grade;
  document.getElementById('eo-score').textContent=`Score: ${score} · Stars: ${starsCollected}`;
  document.getElementById('eo-sub').textContent=score>=150?'You ruled the whirlpool!':'Stay in the green sweet spot!';
  document.getElementById('end-overlay').classList.add('show');
}

function startGame(){
  score=0;starsCollected=0;timeLeft=60;running=true;gameOver=false;
  sAngle=0;sR=115;sSpeed=2.0;sVelR=0;objects=[];wipeFlash=0;
  document.getElementById('end-overlay').classList.remove('show');
  updateHUD();
  clearInterval(timerInt);
  timerInt=setInterval(()=>{if(!running)return;timeLeft--;updateHUD();if(timeLeft<=0){clearInterval(timerInt);endGame();}},1000);
  cancelAnimationFrame(animId);
  requestAnimationFrame(gameLoop);
}

function goBack(){
  running=false;clearInterval(timerInt);cancelAnimationFrame(animId);
  if(window.parent&&window.parent.closeMiniGameScene)window.parent.closeMiniGameScene();
  else history.back();
}

startGame();
</script>
</body>
</html>
