<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💥 POPped Your Mind</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0015;font-family:'Segoe UI',system-ui,sans-serif;color:#e0bbff;
  display:flex;flex-direction:column;align-items:center;
  height:100vh;overflow:hidden;padding:10px;gap:8px;position:relative}
canvas#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
#ui{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;
  width:100%;max-width:600px;gap:8px;height:100%}
#hdr{display:flex;align-items:center;justify-content:space-between;width:100%}
#hdr h1{font-size:1.15rem;color:#cc88ff;letter-spacing:2px;text-shadow:0 0 16px #8800ff}
#back-btn{background:none;border:1px solid #440077;color:#884499;
  border-radius:.4rem;padding:.22rem .6rem;font-size:.68rem;cursor:pointer}
#back-btn:hover{color:#cc88ff;border-color:#aa44ff}
#score-row{display:flex;gap:16px;font-size:.72rem;color:#664488}
#score-row b{color:#cc88ff}
/* Streak dots */
#streak-row{display:flex;gap:10px;align-items:center}
.pop-dot{width:18px;height:18px;border-radius:50%;border:2px solid #440077;background:#0d0020;
  transition:all .3s}
.pop-dot.on{background:#aa44ff;border-color:#cc88ff;box-shadow:0 0 10px #aa44ff}
#streak-label{font-size:.7rem;color:#664488;letter-spacing:.5px}
/* Main card */
#card{background:linear-gradient(160deg,#12001e,#0a0015);
  border:2px solid #440077;border-radius:16px;padding:22px 24px;
  width:100%;flex:1;display:flex;flex-direction:column;gap:14px;
  box-shadow:0 0 40px rgba(170,0,255,.12);position:relative;overflow:hidden}
#card::before{content:'💥';position:absolute;top:-10px;right:-10px;font-size:5rem;
  opacity:.06;pointer-events:none}
#q-type-badge{font-size:.65rem;font-weight:700;letter-spacing:2px;color:#aa44ff;
  text-transform:uppercase;padding:.2rem .6rem;border:1px solid #440077;
  border-radius:2rem;width:fit-content}
#q-text{font-size:1.25rem;font-weight:700;color:#f0d0ff;line-height:1.6;
  background:rgba(170,0,255,.06);border-radius:10px;padding:16px 18px;
  border:1px solid rgba(170,0,255,.2);white-space:pre-line;flex:1}
#input-row{display:flex;gap:8px}
#ans-inp{flex:1;background:rgba(170,0,255,.07);border:1.5px solid #440077;
  border-radius:.6rem;padding:.6rem 1rem;color:#e0bbff;font-size:1.05rem;outline:none;
  font-weight:600}
#ans-inp:focus{border-color:#aa44ff;box-shadow:0 0 0 2px rgba(170,0,255,.2)}
#sub-btn{padding:.6rem 1.4rem;background:linear-gradient(135deg,#5500aa,#330066);
  border:2px solid #aa44ff;border-radius:.6rem;color:#e0bbff;font-size:.9rem;
  font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap}
#sub-btn:hover{background:linear-gradient(135deg,#7700cc,#440088);
  box-shadow:0 4px 16px rgba(170,0,255,.4)}
#yn-row{display:flex;gap:12px}
.yn-btn{flex:1;padding:.65rem;border-radius:.7rem;font-size:1rem;font-weight:700;
  cursor:pointer;transition:all .2s}
.yn-yes{background:rgba(0,200,80,.12);border:2px solid #00aa44;color:#aaffcc}
.yn-yes:hover{background:rgba(0,200,80,.28)}
.yn-no{background:rgba(200,0,60,.1);border:2px solid #aa0044;color:#ffaacc}
.yn-no:hover{background:rgba(200,0,60,.22)}
#feedback{font-size:.95rem;font-weight:700;min-height:1.4rem;text-align:center}
.fb-ok{color:#cc88ff}.fb-no{color:#ff7777}
/* Gear earned flash */
#gear-flash{display:none;position:absolute;inset:0;border-radius:14px;
  background:radial-gradient(circle,rgba(170,0,255,.35),transparent 70%);
  animation:gFlash .6s ease forwards;pointer-events:none;z-index:10}
#gear-flash.show{display:block}
@keyframes gFlash{0%{opacity:1}100%{opacity:0}}
#gear-announce{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(10,0,21,.97);border:2px solid #aa44ff;border-radius:14px;
  padding:22px 32px;text-align:center;z-index:20;
  box-shadow:0 0 40px rgba(170,0,255,.5);animation:popIn .35s cubic-bezier(.34,1.56,.64,1)}
#gear-announce.show{display:block}
@keyframes popIn{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
.ga-emoji{font-size:3rem;margin-bottom:6px}
.ga-title{font-size:1.4rem;font-weight:900;color:#cc88ff}
.ga-sub{font-size:.82rem;color:#664488;margin-top:4px}
/* Character */
#char-img{position:absolute;bottom:0;right:10px;width:64px;height:90px;
  object-fit:cover;object-position:0% 0%;
  filter:drop-shadow(0 0 10px rgba(170,0,255,.5));pointer-events:none;z-index:3}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="ui">
  <div id="hdr">
    <button id="back-btn" onclick="goBack()">← Map</button>
    <h1>💥 POPped Your Mind</h1>
    <div id="score-row">Score <b id="sc">0</b></div>
  </div>
  <div id="streak-row">
    <div class="pop-dot" id="d0"></div>
    <div class="pop-dot" id="d1"></div>
    <div class="pop-dot" id="d2"></div>
    <span id="streak-label">3 in a row = ⚙️ Gear!</span>
  </div>
  <div id="card">
    <div id="gear-flash"></div>
    <div id="q-type-badge">—</div>
    <div id="q-text">Loading…</div>
    <div id="input-row">
      <input id="ans-inp" type="text" inputmode="numeric" placeholder="Answer…" autocomplete="off"
        onkeydown="if(event.key==='Enter')submit()">
      <button id="sub-btn" onclick="submit()">Submit</button>
    </div>
    <div id="yn-row" style="display:none">
      <button class="yn-btn yn-yes" onclick="submitYN(1)">✓ YES</button>
      <button class="yn-btn yn-no" onclick="submitYN(0)">✗ NO</button>
    </div>
    <div id="feedback"></div>
  </div>
</div>
<div id="gear-announce">
  <div class="ga-emoji">⚙️</div>
  <div class="ga-title">Gear Earned!</div>
  <div class="ga-sub" id="ga-sub">Sent to your team!</div>
</div>

<script>
const _params=new URLSearchParams(location.search);
const _charSrc=_params.get('char');
if(_charSrc){
  const img=document.createElement('img');
  img.id='char-img';img.src=_charSrc;
  document.body.appendChild(img);
}

// ── Background sparkle canvas ──
const bgCv=document.getElementById('bg'),bgCtx=bgCv.getContext('2d');
let bgT=0;
function resizeBg(){bgCv.width=innerWidth;bgCv.height=innerHeight;}
window.addEventListener('resize',resizeBg);resizeBg();
function drawBg(){
  const W=bgCv.width,H=bgCv.height;
  bgCtx.fillStyle='#0a0015';bgCtx.fillRect(0,0,W,H);
  // Purple sparkles
  for(let i=0;i<40;i++){
    const x=(i*137.5+bgT*0.3)%W;
    const y=(i*97.3+bgT*0.15)%H;
    const a=0.3+0.3*Math.sin(bgT*0.04+i);
    bgCtx.fillStyle=`rgba(170,68,255,${a})`;
    bgCtx.fillRect(x,y,1.5,1.5);
  }
  // Pop bursts
  for(let i=0;i<5;i++){
    const phase=(bgT*0.02+i*1.26)%(Math.PI*2);
    const r=20+15*Math.sin(phase);
    const cx=W*(0.1+i*0.2);const cy=H*(0.1+((i*0.37)%0.8));
    const g=bgCtx.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0,`rgba(170,0,255,${0.06+0.04*Math.sin(phase)})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    bgCtx.fillStyle=g;bgCtx.beginPath();bgCtx.arc(cx,cy,r,0,Math.PI*2);bgCtx.fill();
  }
  bgT++;requestAnimationFrame(drawBg);
}
drawBg();

// ── Question generation (same ranges as POPped Your Mind spec) ──
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}

const TYPES=['add','sub','mul','div','pal','pat'];
let curQ=null,streak=0,score=0,isPalQ=false;

function genQ(){
  const t=pick(TYPES);
  if(t==='add'){
    const a=rnd(10,999),b=rnd(10,999);
    return{type:'Addition',q:`${a} + ${b} = ?`,a:String(a+b),yn:false};
  }
  if(t==='sub'){
    const a=rnd(100,999),b=rnd(10,a);
    return{type:'Subtraction',q:`${a} − ${b} = ?`,a:String(a-b),yn:false};
  }
  if(t==='mul'){
    const a=rnd(10,99),b=rnd(10,9999);
    return{type:'Multiplication',q:`${a} × ${b} = ?`,a:String(a*b),yn:false};
  }
  if(t==='div'){
    const d=rnd(2,9),q=rnd(10,Math.floor(9999/d));
    return{type:'Division',q:`${d*q} ÷ ${d} = ?`,a:String(q),yn:false};
  }
  if(t==='pal'){
    const isPalStr=s=>s===s.split('').reverse().join('');
    const isPal=Math.random()<.5;
    let n;
    if(isPal){
      // Generate palindrome 3-4 digits
      if(Math.random()<.5){const d=rnd(1,9);const m=rnd(0,9);n=String(d)+m+d;}
      else{const d=rnd(1,9);const m=rnd(0,9);n=String(d)+m+m+d;}
    }else{
      // Non-palindrome 3-4 digits
      do{n=String(rnd(100,9999));}while(isPalStr(n));
    }
    return{type:'Palindrome',q:`Is ${n} a palindrome?\n(type 1 for YES, 0 for NO)`,a:isPal?'1':'0',yn:false};
  }
  // pat
  const start=rnd(1,50),step=rnd(2,15);
  const seq=[start,start+step,start+step*2,start+step*3];
  return{type:'Pattern',q:`${seq[0]},  ${seq[1]},  ${seq[2]},  ?\n= `,a:String(seq[3]),yn:false};
}

function showQ(){
  curQ=genQ();
  document.getElementById('q-type-badge').textContent=curQ.type;
  document.getElementById('q-text').textContent=curQ.q;
  document.getElementById('feedback').textContent='';
  document.getElementById('feedback').className='';
  document.getElementById('ans-inp').value='';
  document.getElementById('input-row').style.display='flex';
  document.getElementById('yn-row').style.display='none';
  setTimeout(()=>document.getElementById('ans-inp').focus(),80);
}

function submit(){
  const val=document.getElementById('ans-inp').value.trim();
  if(!val)return;
  check(val);
}
function submitYN(v){check(String(v));}

function check(val){
  const ok=val===curQ.a;
  const fb=document.getElementById('feedback');
  if(ok){
    streak++;
    score++;
    document.getElementById('sc').textContent=score;
    fb.textContent='✅ Correct!';fb.className='fb-ok';
    updateDots();
    if(streak>=3){
      streak=0;updateDots();
      flashGear();
      setTimeout(showQ,1400);
    }else{
      setTimeout(showQ,700);
    }
  }else{
    streak=0;updateDots();
    fb.textContent=`❌ Answer: ${curQ.a}`;fb.className='fb-no';
    setTimeout(showQ,1100);
  }
}

function updateDots(){
  for(let i=0;i<3;i++){
    document.getElementById('d'+i).classList.toggle('on',i<streak);
  }
}

function flashGear(){
  const fl=document.getElementById('gear-flash');
  fl.classList.remove('show');void fl.offsetWidth;fl.classList.add('show');
  const ann=document.getElementById('gear-announce');
  document.getElementById('ga-sub').textContent='⚙️ Gear sent to your team!';
  ann.classList.add('show');
  // Tell parent to award a gear
  if(window.parent&&window.parent!==window){
    try{window.parent.postMessage({type:'pop_gear_earned'},'*');}catch(e){}
  }
  setTimeout(()=>ann.classList.remove('show'),1800);
}

function goBack(){
  if(window.parent&&window.parent!==window&&window.parent.closeMiniGameScene){
    window.parent.closeMiniGameScene();
  }else{window.history.back();}
}

showQ();
</script>
</body>
</html>
