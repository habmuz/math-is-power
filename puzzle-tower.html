<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔐 Puzzle Tower</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(ellipse at 50% 0%,#0d1a00,#050a00);
  font-family:'Segoe UI',system-ui,sans-serif;color:#ccff88;
  display:flex;flex-direction:column;align-items:center;
  height:100vh;overflow:hidden;padding:8px;gap:6px}
#hdr{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:700px}
#hdr h1{font-size:1.1rem;color:#aaff66;letter-spacing:2px;text-shadow:0 0 12px #44ff00}
#back-btn{background:none;border:1px solid #224400;color:#446600;
  border-radius:.4rem;padding:.22rem .55rem;font-size:.68rem;cursor:pointer}
#back-btn:hover{color:#88ff44;border-color:#558800}
/* Progress bar */
#progress-bar{width:100%;max-width:700px;height:8px;background:#0a1a00;border-radius:4px;overflow:hidden}
#progress-fill{height:100%;background:linear-gradient(90deg,#44ff00,#aaff44);border-radius:4px;transition:width .5s ease}
/* Floor indicator */
#floor-info{font-size:.72rem;color:#446600;display:flex;justify-content:space-between;width:100%;max-width:700px}
/* Tower card */
#tower-card{background:linear-gradient(160deg,#0a1a00,#061000);
  border:2px solid #2a5500;border-radius:14px;padding:20px 24px;
  width:100%;max-width:700px;flex:1;display:flex;flex-direction:column;
  gap:12px;box-shadow:0 0 30px rgba(80,200,0,.1)}
.floor-badge{font-size:.7rem;font-weight:700;letter-spacing:2px;color:#447700;
  text-transform:uppercase;padding:.2rem .6rem;border:1px solid #336600;
  border-radius:2rem;display:inline-block;width:fit-content}
#q-text{font-size:1.15rem;font-weight:600;color:#ddff99;line-height:1.6;
  background:rgba(80,200,0,.05);border-radius:8px;padding:14px 16px;
  border:1px solid rgba(80,200,0,.15);white-space:pre-line}
/* Choices */
#choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice-btn{padding:.65rem 1rem;background:rgba(80,200,0,.07);
  border:1.5px solid #2a5500;border-radius:.6rem;color:#bbff88;
  font-size:.88rem;cursor:pointer;transition:all .18s;text-align:left;font-weight:600}
.choice-btn:hover{background:rgba(80,200,0,.18);border-color:#66aa00}
.choice-btn.correct{background:rgba(0,200,80,.25);border-color:#00ff88;color:#aaffcc}
.choice-btn.wrong{background:rgba(200,0,0,.2);border-color:#ff4444;color:#ffaaaa}
/* Text input */
#text-row{display:flex;gap:8px}
#ans-inp{flex:1;background:rgba(80,200,0,.07);border:1.5px solid #2a5500;
  border-radius:.55rem;padding:.55rem .9rem;color:#ccff88;font-size:1rem;outline:none}
#ans-inp:focus{border-color:#66aa00}
#sub-btn{padding:.55rem 1.4rem;background:linear-gradient(135deg,#1a6600,#0d4400);
  border:2px solid #44aa00;border-radius:.55rem;color:#aaffaa;font-size:.88rem;
  font-weight:700;cursor:pointer;transition:all .2s}
#sub-btn:hover{background:linear-gradient(135deg,#2a8800,#1a5500)}
/* Yes/No */
#yn-row{display:flex;gap:12px}
.yn-btn{flex:1;padding:.65rem;border-radius:.6rem;font-size:1rem;font-weight:700;
  cursor:pointer;transition:all .2s}
.yn-yes{background:rgba(0,200,80,.15);border:2px solid #00aa44;color:#aaffcc}
.yn-yes:hover{background:rgba(0,200,80,.3)}
.yn-no{background:rgba(200,0,60,.12);border:2px solid #aa0044;color:#ffaacc}
.yn-no:hover{background:rgba(200,0,60,.25)}
/* Feedback */
#feedback{font-size:.88rem;min-height:1.2rem;font-weight:600;text-align:center}
.fb-ok{color:#88ff66}.fb-no{color:#ff8888}.fb-hint{color:#ffcc44}
/* Tries */
#tries-dots{display:flex;gap:5px;justify-content:center}
.tdot{width:9px;height:9px;border-radius:50%;background:#1a3300;border:1.5px solid #2a5500}
.tdot.used{background:#ff4444;border-color:#ff8888}
/* Character mascot */
#char-mascot{position:absolute;bottom:0;right:12px;width:72px;height:100px;
  object-fit:cover;object-position:0% 0%;
  filter:drop-shadow(0 0 8px rgba(80,200,0,.4));pointer-events:none}
/* Win screen */
#win-screen{display:none;position:absolute;inset:0;background:rgba(0,8,0,.95);
  flex-direction:column;align-items:center;justify-content:center;gap:16px;
  border-radius:14px}
#win-screen.show{display:flex}
.win-badge{font-size:4rem;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.win-title{font-size:2rem;font-weight:900;color:#aaff66;text-shadow:0 0 24px #44ff00}
.win-sub{font-size:.9rem;color:#668844}
.win-btn{padding:.7rem 2rem;background:linear-gradient(135deg,#1a6600,#0d4400);
  border:2px solid #44aa00;border-radius:.6rem;color:#aaffaa;font-size:.9rem;
  font-weight:700;cursor:pointer;transition:all .2s}
.win-btn:hover{background:linear-gradient(135deg,#2a8800,#1a5500);
  box-shadow:0 0 16px rgba(80,200,0,.4)}
/* Floor complete flash */
#floor-flash{display:none;position:absolute;inset:0;background:rgba(80,200,0,.12);
  border-radius:14px;animation:flash .4s ease forwards}
#floor-flash.show{display:block}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<div id="hdr">
  <button id="back-btn" onclick="goBack()">← Map</button>
  <h1>🔐 Puzzle Tower</h1>
  <div style="font-size:.72rem;color:#446600">Floor <b id="fl-cur">1</b>/10</div>
</div>
<div id="progress-bar"><div id="progress-fill" style="width:0%"></div></div>
<div id="floor-info">
  <span id="fl-hint-row"></span>
  <span id="tries-dots"></span>
</div>

<div id="tower-card" style="position:relative">
  <div id="floor-flash"></div>
  <div id="fl-badge" class="floor-badge">Floor 1</div>
  <div id="q-text"></div>
  <div id="choices"></div>
  <div id="text-row" style="display:none">
    <input id="ans-inp" type="text" placeholder="Your answer..." autocomplete="off" onkeydown="if(event.key==='Enter')submitText()">
    <button id="sub-btn" onclick="submitText()">Submit</button>
  </div>
  <div id="yn-row" style="display:none">
    <button class="yn-btn yn-yes" onclick="submitYN('yes')">✓ YES</button>
    <button class="yn-btn yn-no" onclick="submitYN('no')">✗ NO</button>
  </div>
  <div id="feedback"></div>
  <div id="win-screen">
    <div class="win-badge">🏆</div>
    <div class="win-title">Tower Complete!</div>
    <div class="win-sub" id="win-sub"></div>
    <button class="win-btn" onclick="goBack()">🗺️ Back to Map</button>
  </div>
</div>

<script>
const PUZZLES=[
  {q:'What number comes next?\n1 → 2 → 4 → 8 → ?',type:'choice',
   choices:['10','12','16','20'],ans:'16',hint:'Each number doubles!'},
  {q:'Is RACECAR a palindrome?\n(reads same forwards and backwards)',type:'yn',ans:'yes',
   hint:'R-A-C-E-C-A-R... read it backwards!'},
  {q:'Which doesn\'t belong?\nTRIANGLE · SQUARE · CIRCLE · BANANA',type:'choice',
   choices:['TRIANGLE','SQUARE','CIRCLE','BANANA'],ans:'BANANA',hint:'Three of these are shapes...'},
  {q:'What pair comes next?\nAB → CD → EF → ?',type:'choice',
   choices:['GI','GH','HI','FG'],ans:'GH',hint:'Pairs of alphabet letters in order!'},
  {q:'What number comes next?\n1 → 1 → 2 → 3 → 5 → ?',type:'choice',
   choices:['6','7','8','9'],ans:'8',hint:'Add the two numbers before it!'},
  {q:'Which word IS a palindrome?\n(reads same forwards and backwards)',type:'choice',
   choices:['TIGER','HOUSE','LEVEL','RIVER'],ans:'LEVEL',hint:'Read each one backwards!'},
  {q:'All birds have wings.\nA penguin is a bird.\nDoes a penguin have wings?',type:'yn',
   ans:'yes',hint:'Follow the logic step by step!'},
  {q:'What comes next?\n2 → 6 → 18 → 54 → ?',type:'choice',
   choices:['108','162','126','144'],ans:'162',hint:'Each number × 3!'},
  {q:'Is MADAM a palindrome?\n(reads same forwards and backwards)',type:'yn',
   ans:'yes',hint:'M-A-D-A-M... read it backwards!'},
  {q:'🏆 BOSS PUZZLE\nWhat comes next?\n1 → 4 → 9 → 16 → 25 → ?',type:'choice',
   choices:['30','36','35','42'],ans:'36',hint:'1² 2² 3² 4² 5²... square numbers!'},
];

let floor=0,tries=0,maxTries=3,score=0;

function showFloor(i){
  floor=i;tries=0;
  const p=PUZZLES[i];
  document.getElementById('fl-cur').textContent=i+1;
  document.getElementById('fl-badge').textContent=`Floor ${i+1} ${i===9?'⚡':''}`;
  document.getElementById('q-text').textContent=p.q;
  document.getElementById('progress-fill').style.width=((i/10)*100)+'%';
  document.getElementById('feedback').textContent='';
  document.getElementById('feedback').className='';
  // Reset input areas
  document.getElementById('choices').innerHTML='';
  document.getElementById('text-row').style.display='none';
  document.getElementById('yn-row').style.display='none';
  document.getElementById('ans-inp').value='';
  renderTries();

  if(p.type==='choice'){
    p.choices.forEach(c=>{
      const btn=document.createElement('button');
      btn.className='choice-btn';btn.textContent=c;
      btn.onclick=()=>submitChoice(c,btn);
      document.getElementById('choices').appendChild(btn);
    });
  }else if(p.type==='text'){
    document.getElementById('text-row').style.display='flex';
    setTimeout(()=>document.getElementById('ans-inp').focus(),100);
  }else if(p.type==='yn'){
    document.getElementById('yn-row').style.display='flex';
  }
}

function renderTries(){
  const dots=document.getElementById('tries-dots');
  dots.innerHTML='';
  for(let i=0;i<maxTries;i++){
    const d=document.createElement('div');
    d.className='tdot'+(i<tries?' used':'');
    dots.appendChild(d);
  }
  document.getElementById('fl-hint-row').textContent=tries>=maxTries-1&&PUZZLES[floor].hint?`💡 ${PUZZLES[floor].hint}`:'';
}

function checkAns(val){
  const p=PUZZLES[floor];
  return val.trim().toUpperCase()===p.ans.toUpperCase();
}

function submitChoice(val,btn){
  if(tries>=maxTries)return;
  const ok=checkAns(val);
  btn.classList.add(ok?'correct':'wrong');
  document.querySelectorAll('.choice-btn').forEach(b=>b.onclick=null);
  feedback(ok);
}
function submitText(){submitAny(document.getElementById('ans-inp').value);}
function submitYN(v){submitAny(v);}
function submitAny(val){
  if(tries>=maxTries)return;
  const ok=checkAns(val);feedback(ok);
}

function feedback(ok){
  tries++;renderTries();
  const fb=document.getElementById('feedback');
  if(ok){
    fb.textContent='✅ Correct!';fb.className='fb-ok';
    score++;
    flashFloor();
    setTimeout(()=>{
      if(floor>=PUZZLES.length-1)showWin();
      else showFloor(floor+1);
    },900);
  }else{
    if(tries>=maxTries){
      fb.textContent=`❌ Answer: ${PUZZLES[floor].ans} — moving on!`;fb.className='fb-no';
      setTimeout(()=>{
        if(floor>=PUZZLES.length-1)showWin();
        else showFloor(floor+1);
      },1600);
    }else{
      fb.textContent=`❌ Try again! (${maxTries-tries} left)`;fb.className='fb-no';
    }
  }
}

function flashFloor(){
  const el=document.getElementById('floor-flash');
  el.classList.remove('show');void el.offsetWidth;el.classList.add('show');
}

function showWin(){
  document.getElementById('progress-fill').style.width='100%';
  const stars=score>=9?'⭐⭐⭐':score>=7?'⭐⭐':score>=5?'⭐':'';
  document.getElementById('win-sub').textContent=`${stars}  ${score}/10 floors solved correctly!`;
  document.getElementById('win-screen').classList.add('show');
}

function goBack(){
  if(window.parent!==window&&window.parent.closeMiniGameScene)window.parent.closeMiniGameScene();
  else window.history.back();
}

// Character mascot
const _cSrc=new URLSearchParams(location.search).get('char');
if(_cSrc){
  const img=document.createElement('img');
  img.id='char-mascot';img.src=_cSrc;
  document.getElementById('tower-card').appendChild(img);
}
showFloor(0);
</script>
</body>
</html>
