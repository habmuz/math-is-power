<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Neucha&display=swap" rel="stylesheet">
<title>🌿 Enchanted Garden</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#1a3a10;font-family:'Neucha',cursive;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 8px;gap:4px}
#hdr{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:900px}
#hdr h1{font-size:1.1rem;color:#88ffaa;letter-spacing:2px;text-shadow:0 0 10px #44ff66}
#hdr-r{display:flex;gap:14px;font-size:.75rem;color:#55aa66;align-items:center}
#hdr-r b{color:#aaffcc}
#back-btn{background:none;border:1px solid #2a5a2a;color:#44884a;border-radius:.4rem;padding:.22rem .6rem;font-size:.68rem;cursor:pointer}
#back-btn:hover{color:#88ffaa;border-color:#44aa44}
#game-area{position:relative;background:transparent;border-radius:12px;overflow:hidden;border:2px solid #2a5a2a}
#msg{font-size:.9rem;color:#ccffcc;text-align:center;min-height:1.4em;text-shadow:0 0 8px #44ff44}
#spirit-overlay{display:none;position:absolute;inset:0;background:rgba(0,20,0,.88);z-index:10;align-items:center;justify-content:center;flex-direction:column;gap:12px;border-radius:10px}
#spirit-overlay.show{display:flex}
.sp-icon{font-size:3rem;animation:bounce .8s ease-in-out infinite alternate}
@keyframes bounce{0%{transform:translateY(0)}100%{transform:translateY(-10px)}}
.sp-who{font-size:1rem;color:#aaffcc;letter-spacing:1px}
.sp-msg{font-size:1.4rem;color:#ffffff;font-weight:bold;text-align:center;padding:0 20px}
.sp-btn{padding:.6rem 2rem;background:linear-gradient(135deg,#2a6a2a,#1a4a1a);border:2px solid #66ff66;border-radius:2rem;color:#aaffcc;font-size:1rem;font-weight:bold;cursor:pointer;font-family:'Neucha',cursive;transition:all .2s}
.sp-btn:hover{background:linear-gradient(135deg,#3a8a3a,#226622);border-color:#88ffaa}
#end-overlay{display:none;position:absolute;inset:0;background:rgba(0,20,0,.92);z-index:20;align-items:center;justify-content:center;flex-direction:column;gap:12px;border-radius:10px}
#end-overlay.show{display:flex}
.eo-icon{font-size:4rem}
.eo-title{font-size:1.8rem;color:#88ffcc;font-weight:bold}
.eo-sub{font-size:.9rem;color:#44aa66;text-align:center}
.eo-btn{padding:.6rem 1.8rem;background:linear-gradient(135deg,#2a6a2a,#1a4a1a);border:2px solid #66ff66;border-radius:2rem;color:#aaffcc;font-size:.95rem;font-weight:bold;cursor:pointer;font-family:'Neucha',cursive;margin:3px}
</style>
</head>
<body>
<div id="hdr">
  <button id="back-btn" onclick="goBack()">← Map</button>
  <h1>🌿 Enchanted Garden</h1>
  <div id="hdr-r">Spirits: <b id="sp-count">0</b>/5 &nbsp;|&nbsp; <b id="zone-lbl">Garden Entry ✨</b></div>
</div>
<canvas id="c"></canvas>
<div id="msg">Use arrow keys to explore! Find the glowing garden spirits 🌸</div>

<div id="spirit-overlay">
  <div class="sp-icon" id="sp-icon">🌸</div>
  <div class="sp-who" id="sp-who">A garden spirit appears!</div>
  <div class="sp-msg" id="sp-msg">Hello, little explorer!</div>
  <button class="sp-btn" id="sp-btn" onclick="dismissSpirit()">✨ Thank you!</button>
</div>
<div id="end-overlay">
  <div class="eo-icon">🌸</div>
  <div class="eo-title">Garden Complete! ✨</div>
  <div class="eo-sub">You found all 5 garden spirits!<br>The enchanted garden glows with magic!</div>
  <button class="eo-btn" onclick="restartGame()">Explore Again 🌿</button>
  <button class="eo-btn" onclick="goBack()">← Map</button>
</div>

<script>
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');

const W=Math.min(window.innerWidth-16,900);
const H=Math.min(window.innerHeight-100,500);
cv.width=W; cv.height=H;
cv.style.width=W+'px'; cv.style.height=H+'px';

const TILE=48;
const COLS=Math.floor(W/TILE);
const ROWS=Math.floor(H/TILE);

// Garden zones info
const SPIRITS=[
  {emoji:'🌸',name:'Blossom',msg:'These flowers only bloom for kind hearts! 💐',zone:'Flower Patch'},
  {emoji:'🍄',name:'Mushroom Spirit',msg:'Step on my circle to find the hidden path! 🌟',zone:'Mushroom Circle'},
  {emoji:'🌳',name:'Willow Wisp',msg:'Do you hear my leaves whispering? Shh... 🍃',zone:'Old Willow Tree'},
  {emoji:'🌀',name:'Pool Spirit',msg:'The water shows you wonderful visions! ✨',zone:'Whisper Pool'},
  {emoji:'🗿',name:'Ancient Statue',msg:'I have watched this garden for 1000 years! 😊',zone:'Whispering Statues'},
];

// Decorative tiles per zone
const DECO_TILES=['🌺','🌻','🍀','🌼','🌷','🌸','🍁','🌿','🍃','✨','🌟','💫'];

let grid=[],spiritCells=[],spiritFound=[];
let px,py,spiritsCollected=0;
let running=true,gameOver=false,spiritActive=false;
let moveTimer=0;
const keys={};

function buildGrid(){
  grid=[];
  for(let r=0;r<ROWS;r++){
    grid.push([]);
    for(let c=0;c<COLS;c++){
      // Border
      if(r===0||r===ROWS-1||c===0||c===COLS-1){grid[r].push({type:'wall'});}
      // Bush clusters (decorative walls)
      else if(
        (r===3&&c>2&&c<6)||(r===3&&c>COLS-7&&c<COLS-2)||
        (r===ROWS-4&&c>2&&c<5)||(r===ROWS-4&&c>COLS-6&&c<COLS-2)||
        (r>3&&r<ROWS-3&&c===Math.floor(COLS/2)&&r!==Math.floor(ROWS/2))
      ){grid[r].push({type:'bush'});}
      else{grid[r].push({type:'path',deco:Math.random()<0.12?DECO_TILES[Math.floor(Math.random()*DECO_TILES.length)]:null});}
    }
  }
  // Gaps in walls/bushes
  [[3,4],[3,COLS-5],[ROWS-4,3],[ROWS-4,COLS-4],[Math.floor(ROWS/2),Math.floor(COLS/2)]].forEach(([r,c])=>{
    if(r>0&&r<ROWS-1&&c>0&&c<COLS-1)grid[r][c]={type:'path'};
  });

  // Place spirits
  spiritCells=[];
  const positions=[
    [2,Math.floor(COLS*0.25)],[2,Math.floor(COLS*0.75)],
    [Math.floor(ROWS*0.5),2],[Math.floor(ROWS*0.5),COLS-3],
    [ROWS-2,Math.floor(COLS/2)]
  ];
  positions.forEach(([r,c],i)=>{
    const rr=Math.max(1,Math.min(ROWS-2,r));
    const cc=Math.max(1,Math.min(COLS-2,c));
    grid[rr][cc]={type:'spirit',idx:i,collected:false};
    spiritCells.push({r:rr,c:cc,idx:i,collected:false});
  });

  px=Math.floor(COLS/2); py=Math.floor(ROWS/2);
  spiritsCollected=0;
  spiritFound=Array(5).fill(false);
}

function getTileColor(t,r,c){
  if(t==='wall'||t==='bush')return null; // drawn as emoji
  if(t==='spirit'){
    const s=spiritCells.find(x=>x.r===r&&x.c===c);
    if(s&&s.collected)return '#1a4a1a';
    return null; // drawn separately
  }
  // Path: alternating light greens like a garden
  const even=(r+c)%2===0;
  return even?'#2a5e1a':'#336622';
}

let animT=0;
function draw(ts){
  animT=ts||0;
  ctx.clearRect(0,0,W,H);

  // Sky/garden background
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0e2e08');
  bg.addColorStop(1,'#1a4a10');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const cell=grid[r][c];
      const x=c*TILE, y=r*TILE;
      const col=getTileColor(cell.type,r,c);
      if(col){
        ctx.fillStyle=col;
        ctx.fillRect(x,y,TILE,TILE);
        // subtle grid
        ctx.strokeStyle='rgba(0,80,0,.2)'; ctx.lineWidth=1;
        ctx.strokeRect(x,y,TILE,TILE);
      }

      // Wall/bush
      if(cell.type==='wall'){
        ctx.fillStyle='#0a1e06'; ctx.fillRect(x,y,TILE,TILE);
        ctx.font=`${TILE*0.7}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('🌲',x+TILE/2,y+TILE/2);
      }
      if(cell.type==='bush'){
        ctx.fillStyle='#142e0e'; ctx.fillRect(x,y,TILE,TILE);
        ctx.font=`${TILE*0.65}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('🌳',x+TILE/2,y+TILE/2);
      }

      // Path deco
      if(cell.type==='path'&&cell.deco){
        ctx.font=`${TILE*0.45}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.globalAlpha=0.55; ctx.fillText(cell.deco,x+TILE/2,y+TILE/2); ctx.globalAlpha=1;
      }

      // Spirit tile
      if(cell.type==='spirit'){
        const sc=spiritCells.find(s=>s.r===r&&s.c===c);
        if(sc&&!sc.collected){
          const pulse=Math.sin(animT/400+c)*0.3+0.7;
          // Glow
          const grd=ctx.createRadialGradient(x+TILE/2,y+TILE/2,2,x+TILE/2,y+TILE/2,TILE*0.7);
          grd.addColorStop(0,`rgba(100,255,150,${0.35*pulse})`);
          grd.addColorStop(1,'rgba(100,255,150,0)');
          ctx.fillStyle=grd; ctx.fillRect(x-4,y-4,TILE+8,TILE+8);
          ctx.font=`${TILE*0.7*pulse}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillText(SPIRITS[sc.idx].emoji,x+TILE/2,y+TILE/2);
        }else if(sc&&sc.collected){
          ctx.font=`${TILE*0.5}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.globalAlpha=0.4; ctx.fillText('⭐',x+TILE/2,y+TILE/2); ctx.globalAlpha=1;
        }
      }
    }
  }

  // Floating sparkles
  for(let i=0;i<8;i++){
    const sx=((animT/30+i*137)%W);
    const sy=((animT/50+i*97)%H);
    const a=Math.sin(animT/300+i)*0.5+0.5;
    ctx.globalAlpha=a*0.6;
    ctx.font='12px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('✨',sx,sy);
  }
  ctx.globalAlpha=1;

  // Player
  const px2=px*TILE+TILE/2, py2=py*TILE+TILE/2;
  const bob=Math.sin(animT/250)*3;
  // Glow ring
  const pg=ctx.createRadialGradient(px2,py2+bob,0,px2,py2+bob,28);
  pg.addColorStop(0,'rgba(150,255,180,0.35)');
  pg.addColorStop(1,'rgba(150,255,180,0)');
  ctx.fillStyle=pg; ctx.beginPath(); ctx.arc(px2,py2+bob,28,0,Math.PI*2); ctx.fill();
  // Player emoji
  ctx.font=`${TILE*0.75}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('🧒',px2,py2+bob);
}

function tryMove(dr,dc){
  const nr=py+dr, nc=px+dc;
  if(nr<0||nr>=ROWS||nc<0||nc>=COLS)return;
  const cell=grid[nr][nc];
  if(cell.type==='wall'||cell.type==='bush')return;
  px=nc; py=nr;

  if(cell.type==='spirit'){
    const sc=spiritCells.find(s=>s.r===nr&&s.c===nc&&!s.collected);
    if(sc)showSpirit(sc);
  }
}

function showSpirit(sc){
  if(spiritActive)return;
  spiritActive=true;
  const sp=SPIRITS[sc.idx];
  document.getElementById('sp-icon').textContent=sp.emoji;
  document.getElementById('sp-who').textContent=sp.name+' · '+sp.zone;
  document.getElementById('sp-msg').textContent=sp.msg;
  document.getElementById('spirit-overlay').classList.add('show');
  document.getElementById('zone-lbl').textContent=sp.zone+' ✨';
  sc.collected=true;
  grid[sc.r][sc.c].collected=true;
  spiritsCollected++;
  document.getElementById('sp-count').textContent=spiritsCollected;
}

function dismissSpirit(){
  document.getElementById('spirit-overlay').classList.remove('show');
  spiritActive=false;
  if(spiritsCollected>=5){setTimeout(endGame,400);}
}

function endGame(){
  running=false; gameOver=true;
  cancelAnimationFrame(animId);
  document.getElementById('end-overlay').classList.add('show');
}

document.addEventListener('keydown',e=>{keys[e.key]=true;['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)&&e.preventDefault()});
document.addEventListener('keyup',e=>{keys[e.key]=false});

let animId=null;
function loop(ts){
  if(!running)return;
  moveTimer++;
  if(moveTimer>=10&&!spiritActive){
    moveTimer=0;
    if(keys['ArrowUp']||keys['w'])tryMove(-1,0);
    else if(keys['ArrowDown']||keys['s'])tryMove(1,0);
    else if(keys['ArrowLeft']||keys['a'])tryMove(0,-1);
    else if(keys['ArrowRight']||keys['d'])tryMove(0,1);
  }
  draw(ts);
  animId=requestAnimationFrame(loop);
}

// Touch support
let touchStart=null;
document.addEventListener('touchstart',e=>{touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
document.addEventListener('touchend',e=>{
  if(!touchStart)return;
  const dx=e.changedTouches[0].clientX-touchStart.x;
  const dy=e.changedTouches[0].clientY-touchStart.y;
  if(Math.abs(dx)>Math.abs(dy)){dx>0?tryMove(0,1):tryMove(0,-1);}
  else{dy>0?tryMove(1,0):tryMove(-1,0);}
  touchStart=null;
},{passive:true});

function restartGame(){
  spiritActive=false;
  document.getElementById('spirit-overlay').classList.remove('show');
  document.getElementById('end-overlay').classList.remove('show');
  running=true; gameOver=false; moveTimer=0;
  buildGrid();
  document.getElementById('sp-count').textContent=0;
  document.getElementById('zone-lbl').textContent='Garden Entry ✨';
  document.getElementById('msg').textContent='Use arrow keys to explore! Find the glowing garden spirits 🌸';
  cancelAnimationFrame(animId);
  requestAnimationFrame(loop);
}
function goBack(){
  running=false; cancelAnimationFrame(animId);
  if(window.parent&&window.parent.closeMiniGameScene)window.parent.closeMiniGameScene();
  else history.back();
}

buildGrid();
requestAnimationFrame(loop);
</script>
</body>
</html>
